# Development image only. Keep the target disk and final write decision manual.
d-i debian-installer/locale string es_MX.UTF-8
d-i keyboard-configuration/xkb-keymap select latam
d-i time/zone string America/Mexico_City
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string RunTimeOSDev
d-i netcfg/get_domain string
d-i netcfg/dhcp_timeout string 10
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i passwd/root-login boolean false
d-i passwd/user-fullname string DevMode
d-i passwd/username string devmode
d-i passwd/user-password-crypted password @DEVMODE_PASSWORD_HASH@
d-i passwd/user-default-groups string audio cdrom video sudo
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i pkgsel/upgrade select none
d-i live-installer/enable boolean true
d-i preseed/late_command string in-target /usr/local/sbin/culinaryos-installer-finish
