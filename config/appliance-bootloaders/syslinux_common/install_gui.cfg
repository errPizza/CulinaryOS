label installstart
    menu label ^Instalar CulinaryOS
    menu default
    linux @KERNEL_GI@
    initrd @INITRD_GI@
    append vga=788 @APPEND_INSTALL@ ---

label installtext
    menu label Instalador en modo ^texto
    linux @KERNEL_DI@
    initrd @INITRD_DI@
    append @APPEND_INSTALL@ ---

label rescue
    menu label ^Recuperar una instalacion existente
    linux @KERNEL_DI@
    initrd @INITRD_DI@
    append rescue/enable=true @APPEND_INSTALL@ ---
