insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
terminal_output gfxterm
background_image /boot/grub/culinaryos-installer.png
set timeout=10
set default=0

menuentry 'Instalar CulinaryOS' --hotkey=i {
    linux @KERNEL_GI@ vga=788 @APPEND_INSTALL@ quiet splash loglevel=3 systemd.show_status=error ---
    initrd @INITRD_GI@
}
menuentry 'Instalador en modo texto' --hotkey=t {
    linux @KERNEL_DI@ @APPEND_INSTALL@ quiet splash loglevel=3 systemd.show_status=error ---
    initrd @INITRD_DI@
}
menuentry 'Recuperar una instalacion existente' --hotkey=r {
    linux @KERNEL_DI@ rescue/enable=true @APPEND_INSTALL@ quiet splash loglevel=3 systemd.show_status=error ---
    initrd @INITRD_DI@
}
