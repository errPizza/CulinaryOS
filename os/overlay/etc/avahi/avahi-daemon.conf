# No anunciar una identidad antes de desplegar un sitio.
[server]
allow-interfaces=lo
use-ipv4=yes
use-ipv6=yes
allow-point-to-point=no
ratelimit-interval-usec=1000000
ratelimit-burst=20

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=yes
disable-user-service-publishing=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no
