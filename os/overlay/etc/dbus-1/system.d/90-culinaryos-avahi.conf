<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.Server" send_member="EntryGroupNew"/>
    <deny send_destination="org.freedesktop.Avahi" send_interface="org.freedesktop.Avahi.EntryGroup"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.freedesktop.Avahi"/>
  </policy>
  <policy user="culinaryos-app">
    <allow send_destination="org.freedesktop.Avahi"/>
  </policy>
</busconfig>
