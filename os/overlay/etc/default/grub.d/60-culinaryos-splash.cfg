# Mantener los parámetros existentes y añadir sólo los que faltan.
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" quiet "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }quiet" ;;
esac
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" splash "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
# Menú oculto durante el arranque normal; Esc/F4 lo muestran en esta ventana.
# Las entradas avanzadas y de recuperación siguen disponibles.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" loglevel="*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=3" ;;
esac
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
    *" systemd.show_status="*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT systemd.show_status=error" ;;
esac
