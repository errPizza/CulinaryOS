# Culinary Restaurant: the branch database is reached only over the local Unix socket, with peer authentication
# (Debian's pg_hba.conf). Commits are durable before the backend answers, and memory fits a small branch server.
listen_addresses = ''
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_connections = 40
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
log_min_duration_statement = 2000
log_lock_waits = on
