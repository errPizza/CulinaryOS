#!/usr/sbin/nft -f
# CulinaryOs administra este ruleset completo. Validar desde consola antes de cambiarlo.
flush ruleset
table inet culinaryos {
    chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept
        # Errores, PMTU y descubrimiento IPv6 necesarios; no bloquear ND/RA.
        meta l4proto { icmp, ipv6-icmp } accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        limit rate 4/second burst 8 packets log prefix "CulinaryOs drop: " level info
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
