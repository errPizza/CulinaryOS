name: Pruebas

on:
  push:
    branches: [main, postgresql]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencias de Python
        run: python -m pip install PyNaCl==1.6.2
      - name: Verificación
        shell: pwsh
        run: ./scripts/verify.ps1
